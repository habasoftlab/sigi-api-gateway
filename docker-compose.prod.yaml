version: '3.8'

services:
  api-gateway:
    image: sigi-api-gateway:latest
    container_name: sigi-api-gateway-prod
    ports:
      - "127.0.0.1:8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Si en el futuro quieres cambiar la clave secreta en producción sin tocar el código:
      # - JWT_SECRET=UnaNuevaClaveSuperSeguraParaProduccion123!