server:
  port: 8088

spring:
  application:
    name: api-gateway

# Eureka off
eureka:
  client:
    enabled: false

zuul:
  ignored-services: '*'
  
  sensitive-headers: Cookie,Set-Cookie,Authorization
  
  # Definición manual
  routes:
    auth-service:
      path: /auth/**
      url: http://74.208.192.175:8089
      strip-prefix: false
      
    ordenes-service:
      path: /api/ordenes/**
      url: http://74.208.192.175:8082
      strip-prefix: false

    finanzas-service:
      path: /api/dashboard/**
      url: http://74.208.192.175:8082
      strip-prefix: false

    personas-service:
      path: /api/**
      url: http://74.208.192.175:8081
      strip-prefix: false