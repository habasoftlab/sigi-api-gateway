server:
  port: 8088

spring:
  application:
    name: api-gateway

# Eureka off
eureka:
  client:
    enabled: false

zuul:
  ignored-services: '*'
  
  # Pasar encabezados sensibles como Authorization si usas JWT (Va a nivel raíz de zuul)
  sensitive-headers: Cookie,Set-Cookie,Authorization
  
  # Definición manual de tus rutas (De la más específica a la más genérica)
  routes:
    ordenes-service:
      path: /api/ordenes/**
      url: http://localhost:8082
      strip-prefix: false

    finanzas-service:
      path: /api/dashboard/**
      url: http://localhost:8082
      strip-prefix: false

    personas-service:
      path: /api/**
      url: http://localhost:8081
      strip-prefix: false