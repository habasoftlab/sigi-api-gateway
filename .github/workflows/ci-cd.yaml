name: CI/CD Pipeline Spring Boot

on:
  push:
    branches:
      - main
      - testing
  pull_request:
    branches:
      - develop
      - testing
      - main

jobs:
  # ==========================================
  # FASE 1: INTEGRACIÓN CONTINUA (Ejecución de Pruebas)
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # Ejecuta todas las pruebas unitarias con JUnit. Si una falla, el pipeline se detiene aquí.
      - name: Ejecutar Pruebas Unitarias y Compilar
        run: mvn clean verify

      - name: Subir artefacto compilado (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: target/api-gateway-1.jar

  # ==========================================
  # FASE 2: DESPLIEGUE CONTINUO EN VPS
  # ==========================================
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
    needs: build-and-test
    runs-on: self-hosted
    
    steps:
      - name: Checkout del código en el servidor
        uses: actions/checkout@v4

      - name: Descargar artefacto compilado
        uses: actions/download-artifact@v4
        with:
          name: api-gateway-jar
          path: target/

      - name: Construir y Levantar Docker (Producción)
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t sigi-${{ github.event.repository.name }}:latest .
          docker compose -f docker-compose.prod.yaml up -d --build api-gateway
          docker system prune -f

      - name: Construir y Levantar Docker (Testing)
        if: github.ref == 'refs/heads/testing'
        run: |
          docker build -t sigi-${{ github.event.repository.name }}:test .
          docker compose -f docker-compose.test.yaml up -d --build api-gateway